# Google News：按 topics.yaml 里每个话题的搜索词，中文区、美国区各搜一次（只要过去 24 小时）。
# 热榜上往往只有一句标题，靠这些报道给 AI 补背景，也当来源链接。
google_news: { enabled: true, per_query: 12 }
