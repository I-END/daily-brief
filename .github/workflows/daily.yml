name: daily-brief

on:
  schedule:
    # GitHub 的定时常常晚好几个小时（2026 年 11 月实测晚约 9 小时），所以每小时叫一次。
    # run.py 自己判断：没到设置里的推送时间、或今天已经做好了，就几秒钟结束。
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "重新生成今天的日报"
        type: boolean
        default: false
      fetch_only:
        description: "只测试抓取（不调用 AI、不发布）"
        type: boolean
        default: false
      push_only:
        description: "只把最新一期推送到飞书（测试飞书用）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.push_only }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: run
        name: Fetch, summarize, render
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}   # GitHub 搜索接口（本周新项目、skill）用，免费
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ inputs.fetch_only }}" = "true" ]; then
            python run.py --fetch-only
          elif [ "${{ inputs.force }}" = "true" ]; then
            python run.py --force --no-push
          else
            python run.py --no-push
          fi
      - name: Save today's digest to the repo
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digests
          if ! git diff --cached --quiet; then
            git commit -m "brief: $(TZ=America/New_York date +%F)"
            git pull --rebase
            git push
          fi
      - if: steps.run.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs: deploy
    # after a successful deploy, or on its own when only testing Feishu
    if: ${{ always() && (needs.deploy.result == 'success' || inputs.push_only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}   # branch tip, so it includes the digest committed above
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Push to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          sleep 60   # GitHub Pages caches for a few minutes; give the new page a head start
          python run.py --push-latest ${{ inputs.push_only && '--force' || '' }}
